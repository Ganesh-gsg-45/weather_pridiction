name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  smoke-test:
    name: Smoke Test & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test — import app and confirm Flask object exists
        # Catches broken imports, syntax errors, and missing __init__ before merge.
        # Does NOT start the server — just imports the module and checks app exists.
        env:
          WEATHER_API_KEY: "ci-placeholder-key"
          FLASK_DEBUG: "false"
        run: |
          python - <<'EOF'
          import importlib, sys
          mod = importlib.import_module("app")
          assert hasattr(mod, "app"), "Flask 'app' object not found in app.py"
          from flask import Flask
          assert isinstance(mod.app, Flask), f"'app' is not a Flask instance: {type(mod.app)}"
          print("✅ Smoke test passed — Flask app object confirmed.")
          EOF

      - name: Run unit tests
        # Only runs if tests/ directory exists and contains test files.
        run: |
          if [ -d "tests" ] && ls tests/test_*.py 1>/dev/null 2>&1; then
            pip install pytest
            pytest tests/ -v --tb=short
          else
            echo "No test files found in tests/ — skipping pytest."
          fi
